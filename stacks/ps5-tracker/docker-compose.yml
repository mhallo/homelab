# ps5-tracker (stock alerts), from deploy/docker-compose.yml in the private
# repo https://github.com/mhallo/ps5-tracker
#
# Differences from that example:
# - Image pinned by digest; Portainer pulls it with the ghcr registry
#   credential in terraform/portainer.tf.
# - Secrets come from the stack's environment instead of an env_file.
# - The Telegram login, and config.yml if used, are seeded into the data
#   volume; see README.md. Without config.yml it runs the image's built-in
#   PS5 Pro config.
# - Alerts go to the bark stack over the proxy network, not ntfy.
# - Routed through Traefik for the status server (/ping, /status, /healthz)
#   instead of publishing 8080.

services:
  tracker:
    image: ghcr.io/mhallo/ps5-tracker:0.4.0@sha256:702e1aab48cb8341d46568f31dbd47b5b80e4eba2aa894743248af84a273318c
    container_name: ps5-tracker
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - BARK_SERVER=http://bark:8080
      - BARK_KEY=${BARK_KEY}
      - TG_APP_ID=${TG_APP_ID}
      - TG_APP_HASH=${TG_APP_HASH}
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ps5-tracker.rule=Host(`ps5-tracker.gt3.dev`)"
      - "traefik.http.routers.ps5-tracker.entrypoints=websecure"
      - "traefik.http.services.ps5-tracker.loadbalancer.server.port=8080"

volumes:
  data:

networks:
  proxy:
    external: true
