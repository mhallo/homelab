services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/jellyfin:/config
      - /volume1/Media:/mnt/storage:ro
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "105"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.gt3.dev`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.gt3.dev`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/sonarr:/config
      - /volume1/Media:/mnt/storage
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.gt3.dev`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/radarr:/config
      - /volume1/Media:/mnt/storage
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.gt3.dev`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/lidarr:/config
      - /volume1/Media:/mnt/storage
    ports:
      - "8686:8686"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.gt3.dev`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`requests.gt3.dev`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"

  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
      - DEBRIDS__0__PROVIDER=realdebrid
      - DEBRIDS__0__NAME=RealDebrid
      - DEBRIDS__0__API_KEY=${RD_API_KEY}
      - MOUNT__TYPE=rclone
      - MOUNT__MOUNT_PATH=/mnt/decypharr
      - MOUNT__RCLONE__CACHE_DIR=/cache/rclone
    volumes:
      - /volume1/Software/Docker-Appdata/decypharr:/app
      - /volume1/Software/Docker-Appdata/decypharr-cache:/cache
      - /volume1/Media:/mnt/storage:rshared
    ports:
      - "8282:8282"
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decypharr.rule=Host(`decypharr.gt3.dev`)"
      - "traefik.http.routers.decypharr.entrypoints=websecure"
      - "traefik.http.services.decypharr.loadbalancer.server.port=8282"

networks:
  media:
    name: media-net
    driver: bridge
  proxy:
    external: true
