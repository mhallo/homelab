      - /volume1/Software/Docker-Appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.gt3.dev`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/Software/Docker-Appdata/sonarr:/config
      - /volume1/Media:/mnt/storage
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks: [media, proxy]
    labels:
      - "traefik.enable=true"
