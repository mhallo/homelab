# Wildcard certificate for *.gt3.dev via Cloudflare DNS-01.
#
# DNS-01 means Let's Encrypt validates by reading a TXT record it asks
# Cloudflare to create -- it never connects to the NAS. That is why this
# works with nothing exposed to the internet and a private-IP A record.
#
# defaultGeneratedCert makes every router use this wildcard automatically,
# so routers only need `tls: {}` and never repeat the domain list.

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: cloudflare
        domain:
          main: "gt3.dev"
          sans:
            - "*.gt3.dev"

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
