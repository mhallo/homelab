# Traefik STATIC configuration.
# Changes here require a container restart (Portainer redeploy does this).

global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  # Dashboard is served through the router in dynamic/routes.yml,
  # never on an exposed insecure port.
  insecure: false

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true          # hot-reload route changes, no restart needed

certificatesResolvers:
  cloudflare:
    acme:
      # Traefik's static config sources (file / CLI / env) are MUTUALLY
      # EXCLUSIVE, so this cannot be an ${ENV_VAR} while this file is in use.
      # It is therefore committed in the clear -- which is why it is an alias
      # on our own domain, forwarded via Cloudflare Email Routing, and not a
      # personal address. Let's Encrypt only uses it for expiry notices.
      email: acme@gt3.dev
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        # Resolve against public DNS directly. Required because your LAN
        # resolver may not see the _acme-challenge TXT record propagate.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        delayBeforeCheck: 10

log:
  level: INFO

accessLog:
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
