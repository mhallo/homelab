services:
  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls=true"
      - "--entryPoints.websecure.http.tls.certResolver=cloudflare"
      - "--entryPoints.websecure.http.tls.domains[0].main=gt3.dev"
      - "--entryPoints.websecure.http.tls.domains[0].sans=*.gt3.dev"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=acme@gt3.dev"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}"
    volumes:
      # Portainer's git checkout, by its HOST path. Portainer writes the repo
      # to /data/compose/<stackId>/ inside its own container; the Docker daemon
      # resolves bind mounts on the host, where that path does not exist -- it
      # silently creates an empty dir instead. /data is bind-mounted from
      # /volume1/docker/portainer, so this is the same directory, addressed the
      # way the daemon sees it.
      # NOTE: the "11" is this stack's id. Recreating the stack changes it and
      # breaks this mount silently. Moving routing to Docker labels removes the
      # dependency entirely.
      - "/volume1/docker/portainer/compose/11/stacks/traefik/dynamic:/etc/traefik/dynamic:ro"
      - "/volume1/Software/Docker-Appdata/traefik/letsencrypt:/letsencrypt"
