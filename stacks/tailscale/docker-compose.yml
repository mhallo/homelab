# The tailscale-state volume holds this node's WireGuard keys. Lose it and the
# NAS rejoins the tailnet as a new node with a new IP, and the subnet route
# needs approving again.

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: tailscale
    hostname: tailscale-nginx
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Advertises the LAN so tailnet devices can reach *.gt3.dev remotely.
      # Also needs approving in the admin console, and ip_forward on the NAS
      # (/etc/sysctl.d/99-tailscale.conf).
      - TS_ROUTES=10.10.2.0/24
    volumes:
      # Named volume, not a bind mount: it resolves by name rather than by a
      # path that depends on where Portainer happens to put the checkout.
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"Online\": true'"]
      interval: 1m
      timeout: 10s
      retries: 3

volumes:
  tailscale-state:
