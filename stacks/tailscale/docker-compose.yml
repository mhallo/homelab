# Migrating this stack: see "Migrating tailscale" in the README. Its state
# volume holds the node's WireGuard keys -- lose it and the NAS rejoins the
# tailnet as a new node with a new IP, and the subnet route needs re-approving.

services:
  tailscale:
    image: tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: tailscale
    hostname: tailscale-nginx
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Advertises the LAN so tailnet devices can reach *.gt3.dev remotely.
      # Also needs approving in the admin console, and ip_forward on the NAS
      # (/etc/sysctl.d/99-tailscale.conf).
      - TS_ROUTES=10.10.2.0/24
    volumes:
      # Named volume, not a bind mount: it resolves by name rather than by a
      # path that depends on where Portainer happens to put the checkout.
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"Online\": true'"]
      interval: 1m
      timeout: 10s
      retries: 3

  # This plain nginx predates Traefik and is superseded by it.
  # Left running deliberately -- remove it only once Traefik is proven.
  nginx:
    image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
    container_name: nginx_server
    ports:
      - "8080:80"
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
