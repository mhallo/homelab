# Sure (personal finance), from upstream's compose.example.yml:
# https://github.com/we-promise/sure/blob/main/docs/hosting/docker.md
#
# Differences from upstream:
# - No insecure fallbacks for SECRET_KEY_BASE / POSTGRES_PASSWORD; they're
#   Portainer env vars (see .env.example).
# - The backup profile is dropped. It bind mounts ./bin/db-backup.sh, which
#   resolves against Portainer's checkout and would come up empty. The
#   db-backup service replaces it.
# - AI / OpenAI variables are left out until they're wanted.

x-db-env: &db_env
  POSTGRES_USER: sure_user
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: sure_production

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  # Encrypts bank/provider tokens, API keys and MFA secrets in Postgres.
  # Losing or changing these makes that data unreadable.
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
  SELF_HOSTED: "true"
  # Traefik terminates TLS and forwards plain HTTP.
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  # Changing either of these after registering a passkey invalidates it.
  WEBAUTHN_RP_ID: gt3.dev
  WEBAUTHN_ALLOWED_ORIGINS: https://sure.gt3.dev
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  TZ: America/Los_Angeles

services:
  web:
    image: ghcr.io/we-promise/sure:0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090
    container_name: sure_web
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Upstream's workaround for IPv6-first resolution hanging market data
    # syncs (Yahoo Finance). Compose service names still resolve internally.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sure.rule=Host(`sure.gt3.dev`)"
      - "traefik.http.routers.sure.entrypoints=websecure"
      - "traefik.http.services.sure.loadbalancer.server.port=3000"

  worker:
    image: ghcr.io/we-promise/sure:0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090
    container_name: sure_worker
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  db:
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    container_name: sure_postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    # start_period covers first-run initdb, which on the NAS takes longer than
    # 5 retries x 5s. Without it the first deploy fails as "unhealthy".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Nightly pg_dump into db-backups, which Backrest uploads offsite. Backing
  # up postgres-data directly could catch it mid-write. From
  # https://github.com/prodrigestivill/docker-postgres-backup-local#docker-compose;
  # -Z0 leaves dumps uncompressed so restic can dedupe them, and only a week
  # is kept here because restic keeps the history.
  # The image's /backups is owned by root, so a fresh db-backups volume isn't
  # writable by postgres. This one-shot hands it over and exits; it's the
  # only part that runs as root.
  db-backup-init:
    image: prodrigestivill/postgres-backup-local:16@sha256:a0103fbce0c48ccc7693ddbb2a2bfa733048db845354f635efef9e4566de185d
    container_name: sure_db-backup-init
    user: root
    entrypoint: ["chown", "postgres:postgres", "/backups"]
    volumes:
      - db-backups:/backups
    restart: "no"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16@sha256:a0103fbce0c48ccc7693ddbb2a2bfa733048db845354f635efef9e4566de185d
    container_name: sure_db-backup
    user: postgres:postgres
    volumes:
      - db-backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: sure_production
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: -Z0
      BACKUP_SUFFIX: .sql
      SCHEDULE: "0 1 * * *"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
      TZ: America/Los_Angeles
    depends_on:
      db:
        condition: service_healthy
      db-backup-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    container_name: sure_redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  app-storage:
  postgres-data:
  redis-data:
  db-backups:
