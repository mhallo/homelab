# Prep tracker, from deploy/docker-compose.yml in mhallo/prep-tracker.
#
# Differences from upstream:
# - ./data bind mount is a named volume. A relative bind mount resolves against
#   Portainer's checkout and comes up empty. The volume is seeded from the
#   image's /data on first mount, which is already owned by uid 1000, so no
#   chown is needed.
# - Routed by Traefik labels instead of publishing 8085 for NPM.
# - Pinned to a digest instead of a bare `latest`; Renovate bumps it.

services:
  prep-tracker:
    image: ghcr.io/mhallo/prep-tracker:latest@sha256:7f41c6ff66c9fff8216632c4879a85d18593b06adeb1ca3581a3d65b0fc6b4bf
    container_name: prep-tracker
    user: "1000:1000"
    volumes:
      - data:/data
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prep.rule=Host(`prep.gt3.dev`)"
      - "traefik.http.routers.prep.entrypoints=websecure"
      - "traefik.http.services.prep.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true

volumes:
  data:
