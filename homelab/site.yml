---
- name: Setup homelab compute node
  hosts: localhost
  become: true

  vars:
    homelab_folders:
      - /srv/docker
      - /srv/data
      - /srv/backups
      - /srv/config
    ssh_user: "{{ ansible_user_id }}"

  tasks:

    - name: Install Docker Engine and Compose plugin
      hosts: localhost
      become: true
      tasks:
        
      - name: Remove old Docker versions if present
        apt:
          name:
            - docker
            - docker-engine
            - docker.io
            - containerd
            - runc
          state: absent
          purge: yes
        ignore_errors: yes  # in case they aren't installed

      - name: Install prerequisites for Docker
        apt:
          name:
            - ca-certificates
            - curl
            - gnupg
          state: present
          update_cache: yes

      - name: Ensure /etc/apt/keyrings exists
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Add Docker GPG key
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.gpg
          mode: '0644'

      - name: Add Docker apt repository
        apt_repository:
          repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
          state: present

      - name: Update apt cache
        apt:
          update_cache: yes

      - name: Install Docker Engine and Compose plugin
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present

    - name: Ensure homelab base folders exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0755'
      loop: "{{ homelab_folders }}"

    - name: Install unattended-upgrades package
      apt:
        name: unattended-upgrades
        state: present
        update_cache: yes

    - name: Enable unattended-upgrades
      lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^APT::Periodic::Update-Package-Lists', line: 'APT::Periodic::Update-Package-Lists "1";' }
        - { regexp: '^APT::Periodic::Unattended-Upgrade', line: 'APT::Periodic::Unattended-Upgrade "1";' }
